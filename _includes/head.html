<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<base target="_blank">

	<title class="pageTitle">{{ site.page_title }}</title>
	<meta name="description" content="{{ site.app_description }}">
	<meta name="keywords" content="learn Spanish, shadowing technique, speak Spanish, Spanish pronunciation, Spanish practice app, language learning iOS, fluency in Spanish, production freeze Spanish">

	<link rel="canonical" href="https://shadowingkit.github.io">
	<link rel="shortcut icon" href="{{ site.app_icon | relative_url }}">

	<!-- Open Graph -->
	<meta property="og:title" content="ShadowingKit – Learn to Speak Spanish, Not Just Understand It">
	<meta property="og:description" content="The proven shadowing technique, 100+ native-speaker episodes, and AI content creation. Break through production freeze and sound natural in Spanish.">
	<meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}">
	<meta property="og:url" content="https://shadowingkit.github.io">
	<meta property="og:type" content="website">

	<!-- Twitter Card -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="ShadowingKit – Speak Spanish Naturally">
	<meta name="twitter:description" content="100+ native-speaker episodes + AI transcription. The shadowing technique for A2–B2 Spanish learners.">
	<meta name="twitter:image" content="{{ '/assets/og-image.png' | absolute_url }}">

	<!-- JSON-LD: SoftwareApplication -->
	<script type="application/ld+json">
	{
	  "@context": "https://schema.org",
	  "@type": "SoftwareApplication",
	  "name": "ShadowingKit - Spanish Practice",
	  "operatingSystem": "iOS",
	  "applicationCategory": "EducationApplication",
	  "offers": {
	    "@type": "Offer",
	    "price": "0",
	    "priceCurrency": "USD",
	    "description": "Free with premium subscription ($14.99/month or $99.99/year)"
	  },
	  "description": "Spanish pronunciation practice app using the shadowing technique. 100+ native-speaker episodes with synchronized text highlighting.",
	  "url": "https://shadowingkit.github.io",
	  "downloadUrl": "https://apps.apple.com/app/id6476920610"
	}
	</script>

	<!-- JSON-LD: FAQPage -->
	<script type="application/ld+json">
	{
	  "@context": "https://schema.org",
	  "@type": "FAQPage",
	  "mainEntity": [
	    {
	      "@type": "Question",
	      "name": "What is the shadowing technique?",
	      "acceptedAnswer": {
	        "@type": "Answer",
	        "text": "Shadowing is a technique where you speak simultaneously with a native speaker, mimicking their rhythm, intonation, and pronunciation in real time. Originally developed for conference interpreter training, it builds speech automaticity, the ability to produce language without conscious translation."
	      }
	    },
	    {
	      "@type": "Question",
	      "name": "How is shadowing different from just listening and repeating?",
	      "acceptedAnswer": {
	        "@type": "Answer",
	        "text": "In standard listen-and-repeat, you stop the audio, think about what you heard, then say it, which keeps the analytical brain in control. In shadowing, you speak simultaneously with the audio, forcing your brain to bypass conscious translation and produce speech as a reflex. This is what builds real fluency."
	      }
	    },
	    {
	      "@type": "Question",
	      "name": "How long until I see results from shadowing?",
	      "acceptedAnswer": {
	        "@type": "Answer",
	        "text": "Research shows noticeable pronunciation gains within 4–6 weeks of consistent 10–15 minute daily sessions. Comprehension improvements appear even earlier, typically within 2–3 weeks."
	      }
	    },
	    {
	      "@type": "Question",
	      "name": "How much time per day do I need for shadowing?",
	      "acceptedAnswer": {
	        "@type": "Answer",
	        "text": "10–15 minutes of focused shadowing per day is the research-backed sweet spot. Consistency matters far more than session length, daily short sessions outperform occasional long ones."
	      }
	    },
	    {
	      "@type": "Question",
	      "name": "Do I need to understand the content to shadow it?",
	      "acceptedAnswer": {
	        "@type": "Answer",
	        "text": "No, and that's part of what makes shadowing powerful. You train your phonological system even while processing meaning. That said, ShadowingKit's curated library is structured by proficiency level so you can start with content appropriate to your comprehension."
	      }
	    },
	    {
	      "@type": "Question",
	      "name": "Is ShadowingKit good for complete beginners?",
	      "acceptedAnswer": {
	        "@type": "Answer",
	        "text": "Yes. The app includes a dedicated A2 entry path called 'Spanish in Two Minutes', 50+ short, slow-paced episodes designed to prevent cognitive overload for upper beginners. You need basic vocabulary, but you don't need to be intermediate to start."
	      }
	    },
	    {
	      "@type": "Question",
	      "name": "What's the difference between the curated library and my own content?",
	      "acceptedAnswer": {
	        "@type": "Answer",
	        "text": "The curated library is recorded by a native speaker at controlled pacing, structured by proficiency level, and covers topics designed to be engaging and culturally relevant. Your own content lets you shadow anything that interests you, a TikTok creator you follow, a podcast, a TV show, auto-transcribed and formatted the same way."
	      }
	    },
	    {
	      "@type": "Question",
	      "name": "How does the auto-transcription work?",
	      "acceptedAnswer": {
	        "@type": "Answer",
	        "text": "You import an audio or video file (or record audio directly in the app), and the app automatically generates a synchronized transcript using speech recognition. The result is the same highlighted-text shadowing experience as the curated content."
	      }
	    },
	    {
	      "@type": "Question",
	      "name": "Is there a free trial?",
	      "acceptedAnswer": {
	        "@type": "Answer",
	        "text": "Yes, in two ways. About 20% of the library is permanently free from the moment you sign up, no credit card required. If you decide to go premium, both plans include a 3-day free trial before you're charged."
	      }
	    },
	    {
	      "@type": "Question",
	      "name": "What does the premium subscription include?",
	      "acceptedAnswer": {
	        "@type": "Answer",
	        "text": "Full access to the entire curated library (100+ episodes), unlimited custom content imports, and all future content updates. $14.99/month or $99.99/year."
	      }
	    },
	    {
	      "@type": "Question",
	      "name": "Does ShadowingKit work offline?",
	      "acceptedAnswer": {
	        "@type": "Answer",
	        "text": "Curated episodes can be downloaded for offline use. Custom content you've already imported is also available offline after the initial transcription."
	      }
	    }
	  ]
	}
	</script>

	<!-- JSON-LD: HowTo -->
	<script type="application/ld+json">
	{
	  "@context": "https://schema.org",
	  "@type": "HowTo",
	  "name": "How to Practice Spanish with the Shadowing Technique",
	  "description": "A 4-step method to improve Spanish speaking using the shadowing technique with ShadowingKit.",
	  "step": [
	    {
	      "@type": "HowToStep",
	      "position": 1,
	      "name": "Choose Your Content",
	      "text": "Select a curated episode matched to your level, or import your own Spanish content from TikTok, Instagram, or any video file."
	    },
	    {
	      "@type": "HowToStep",
	      "position": 2,
	      "name": "Listen and Analyze",
	      "text": "Play through the audio with the full transcript visible. Get familiar with the speaker's pace, rhythm, and pronunciation before you shadow."
	    },
	    {
	      "@type": "HowToStep",
	      "position": 3,
	      "name": "Shadow Out Loud",
	      "text": "Speak simultaneously with the native speaker. Follow the highlighted text to stay in sync. Sentence-by-sentence navigation lets you repeat any phrase until it feels natural."
	    },
	    {
	      "@type": "HowToStep",
	      "position": 4,
	      "name": "Progress to Blind Shadowing",
	      "text": "As your confidence builds, practice without the text, forcing your brain to process and produce Spanish purely by ear. This is where automaticity is forged."
	    }
	  ]
	}
	</script>

	<!-- Smart App Banner -->
	{% if site.enable_smart_app_banner %}
		<meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">
	{% endif %}
