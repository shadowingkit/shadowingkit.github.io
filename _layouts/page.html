---
# Front matter comment to ensure Jekyll properly reads file.
---

<!DOCTYPE html>
<html lang="en-us">

{% include head.html %}

<body class="subPageBody">
    <div class="headerBackground subPageHeaderBackground">
        <div class="container subPageContainer">
        {% include header.html %}
            <article class="page markdown-body">
                {{ content }}
                <div class="pageCta">
                    <img class="pageCtaIcon" src="{{ site.app_icon | relative_url }}" alt="ShadowingKit app icon" width="64" height="64">
                    <div class="pageCtaText">
                        <strong>ShadowingKit</strong>
                        <span>Spanish speaking practice with the shadowing technique. First episodes free.</span>
                    </div>
                    <a class="appStoreLink" href="{{ site.appstore_link }}"><img class="pageCtaBadge" src="{{ '/assets/appstore.png' | relative_url }}" alt="Download on the App Store"></a>
                </div>
            </article>
        </div>
    </div>
</body>

</html>
